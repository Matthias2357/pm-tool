services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_tool}
      POSTGRES_USER: ${POSTGRES_USER:-pm_tool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm_tool_dev_password}
    volumes:
      - ${PM_TOOL_CONTENTS_DIR:-../pm-tool-contents}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-pm_tool}:${POSTGRES_PASSWORD:-pm_tool_dev_password}@db:5432/${POSTGRES_DB:-pm_tool}
      MEDIA_ROOT: /app/uploads
    volumes:
      - ./backend:/app
      - ${PM_TOOL_CONTENTS_DIR:-../pm-tool-contents}/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
